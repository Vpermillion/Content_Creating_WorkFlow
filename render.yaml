services:
  - type: web
    name: ifverse-publishing
    runtime: docker
    plan: starter
    dockerfilePath: ./deploy/Dockerfile.publishing
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: ifverse-private-state
      mountPath: /state
      sizeGB: 5
    envVars:
      - key: IFVERSE_API_TOKEN
        generateValue: true
      - key: IFVERSE_MEDIA_KEY
        generateValue: true
      - key: IFVERSE_OWNER_PASSWORD
        generateValue: true
