name: Ifverse review video
on:
  push:
    branches: [codex/ifverse-workflow]
    paths: ['review-requests/*.json']
permissions:
  contents: write
concurrency:
  group: ifverse-review-video
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Select the committed production request
        id: request
        run: python3 scripts/select_review_request.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test-video.txt
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --disable-pip-version-check -r requirements-test-video.txt
      - name: Restore verified sources and models
        uses: actions/cache@v6.1.0
        with:
          path: |
            private/test-video/models
            private/test-video/footage
          key: ifverse-review-cpu-v1-${{ hashFiles('requirements-test-video.txt', 'edits/ifverse-anime-naruto-visual-v3.json') }}
      - name: Regression checks
        run: python -m unittest discover -s tests -v
      - name: Render the requested review version
        env:
          REQUEST_PATH: ${{ steps.request.outputs.path }}
        run: |
          python scripts/render_test_video.py --request "$REQUEST_PATH" \
            --output private/review-video/output --models private/test-video/models
      - name: Preserve the result without changing the source branch
        if: always() && steps.request.outcome == 'success'
        env:
          REQUEST_PATH: ${{ steps.request.outputs.path }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess
          request = json.loads(pathlib.Path(os.environ['REQUEST_PATH']).read_text())
          source = pathlib.Path('private/review-video/output')
          if not source.exists():
              source.mkdir(parents=True)
              (source/'result.json').write_text(json.dumps({'status':'failed','error':'Prerequisite or regression failed','publishing_enabled':False}))
          target = pathlib.Path('artifacts')/request['id']
          shutil.copytree(source,target)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--force',str(target)],check=True)
          subprocess.run(['git','commit','-m','Save requested visual-match review video'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+request['result_branch']],check=True)
          PY
      - name: Review download
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ifverse-review-video
          path: private/review-video/output/
          retention-days: 7
          if-no-files-found: warn
