name: Ifverse media tools
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [find, search, collect, enhance, build]
        default: find
      label:
        type: string
        default: Naruto running
      provider:
        type: choice
        options: [tenor, youtube]
        default: tenor
      asset_id:
        type: string
        default: ''
      story_path:
        type: string
        default: ''
      enhancement:
        type: choice
        options: [anime-light, clean-light, 'off']
        default: anime-light
  push:
    branches: [codex/youtube-oauth]
    paths: ['media-requests/*.json']
permissions:
  contents: read
concurrency:
  group: ifverse-media-bank
  cancel-in-progress: false
jobs:
  media:
    runs-on: [self-hosted, linux, x64, ifverse-media]
    timeout-minutes: 10
    env:
      IFVERSE_MEDIA_BANK: ${{ vars.IFVERSE_MEDIA_BANK || format('{0}/ifverse-media-bank', runner.workspace) }}
      IFVERSE_MEDIA_OUTPUT: ${{ runner.temp }}/ifverse-media-output
      IFVERSE_NARRATION_PATH: ${{ vars.IFVERSE_NARRATION_PATH }}
      MEDIA_OPERATION: ${{ inputs.operation }}
      MEDIA_LABEL: ${{ inputs.label }}
      MEDIA_PROVIDER: ${{ inputs.provider }}
      MEDIA_ASSET_ID: ${{ inputs.asset_id }}
      MEDIA_STORY_PATH: ${{ inputs.story_path }}
      MEDIA_ENHANCEMENT: ${{ inputs.enhancement }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare isolated media environment
        shell: bash
        run: |
          command -v python3
          command -v ffmpeg
          command -v ffprobe
          mkdir -p "$IFVERSE_MEDIA_BANK"
          if [ ! -x "$IFVERSE_MEDIA_BANK/venv/bin/python" ]; then
            python3 -m venv "$IFVERSE_MEDIA_BANK/venv"
          fi
          "$IFVERSE_MEDIA_BANK/venv/bin/python" -m pip install --disable-pip-version-check -q -r requirements-media.txt
      - name: Run committed request
        if: github.event_name == 'push'
        shell: bash
        run: '"$IFVERSE_MEDIA_BANK/venv/bin/python" scripts/run_media_workflow.py --from-commit'
      - name: Run manual request
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: '"$IFVERSE_MEDIA_BANK/venv/bin/python" scripts/run_media_workflow.py'
      - name: Save compact result and review outputs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ifverse-media-result
          path: ${{ runner.temp }}/ifverse-media-output/
          retention-days: 7
          if-no-files-found: warn
# On-demand media processing uses a user-owned runner and persistent footage cache.
# No scheduler, public upload, Google credentials or hosted video-production job.

