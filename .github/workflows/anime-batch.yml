name: Ifverse anime batch
on:
  push:
    branches: [codex/ifverse-workflow]
    paths: ['batch-requests/*.json']
permissions:
  contents: write
concurrency:
  group: ifverse-anime-batch
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      batch: ${{ steps.request.outputs.batch }}
      ids: ${{ steps.request.outputs.ids }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - id: request
        name: Validate the single committed batch and topic reservations
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          from scripts.render_anime_batch import load_batch
          changed = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
          paths = [p for p in changed if p.startswith('batch-requests/') and p.endswith('.json')]
          if len(paths) != 1:
              raise ValueError('Commit exactly one batch request')
          batch = load_batch(paths[0])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('batch='+paths[0]+'\n')
              out.write('ids='+json.dumps([e['id'] for e in batch['episodes']])+'\n')
          PY
  render:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episode: ${{ fromJSON(needs.select.outputs.ids) }}
    env:
      EPISODE_ID: ${{ matrix.episode }}
      BATCH_PATH: ${{ needs.select.outputs.batch }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Refuse regeneration when a saved result already exists
        run: |
          RESULT_BRANCH=$(python3 -c 'import os; from scripts.render_anime_batch import load_batch,result_branch; b=load_batch(os.environ["BATCH_PATH"]); print(result_branch(b,next(e for e in b["episodes"] if e["id"]==os.environ["EPISODE_ID"])))')
          if git ls-remote --exit-code origin "refs/heads/$RESULT_BRANCH"; then
            echo 'Saved result exists. Inspect it and reconcile before another attempt.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test-video.txt
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --disable-pip-version-check -r requirements-test-video.txt
      - uses: actions/cache@v6.1.0
        with:
          path: private/test-video/models
          key: ifverse-batch-models-v1-${{ hashFiles('requirements-test-video.txt') }}
      - name: Render narration, matching footage, captions and effects
        run: |
          python scripts/render_anime_batch.py --batch "$BATCH_PATH" --episode "$EPISODE_ID" \
            --output private/anime-batch/output --models private/test-video/models
      - name: Preserve result without changing source or publication state
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          from whatif.topics import script_hash
          from scripts.render_anime_batch import result_branch
          batch=json.loads(pathlib.Path(os.environ['BATCH_PATH']).read_text())
          episode=next(e for e in batch['episodes'] if e['id']==os.environ['EPISODE_ID'])
          branch=result_branch(batch,episode)
          if subprocess.run(['git','ls-remote','--exit-code','origin','refs/heads/'+branch],capture_output=True).returncode==0:
              raise SystemExit('Saved result exists; no overwrite')
          source=pathlib.Path('private/anime-batch/output')
          if not source.exists():
              source.mkdir(parents=True)
              (source/'batch-result.json').write_text(json.dumps({'id':episode['id'],'batch_id':batch['id'],
                'script_sha256':script_hash(episode['scenes']),'status':'failed','error':'Prerequisite failed',
                'result_branch':branch,'publication_clearance':'not_established','uploaded':False}))
          target=pathlib.Path('artifacts')/episode['id']
          shutil.copytree(source,target)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--force',str(target)],check=True)
          subprocess.run(['git','commit','-m','Save bounded anime batch episode result'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ matrix.episode }}
          path: private/anime-batch/output/
          retention-days: 7
          if-no-files-found: warn
  summarize:
    needs: [select, render]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    env:
      BATCH_PATH: ${{ needs.select.outputs.batch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Save topic outcomes and one compact batch index
        run: python3 scripts/finalize_anime_batch.py --batch "$BATCH_PATH" --save-to-github
