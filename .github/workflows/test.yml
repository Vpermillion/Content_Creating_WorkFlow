name: Software checks
on:
  pull_request:
  push:
    branches: [codex/ifverse-chatgpt-publishing]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure media dependencies
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 120 sudo apt-get update
            timeout 120 sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - name: Install test dependencies
        run: python -m pip install numpy==2.3.5 -r requirements-youtube-publish.txt
      - name: Python regression suite
        id: python
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MCP dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sites
      - name: MCP protocol test
        id: mcp
        run: npm test
        working-directory: sites
      - name: Preserve CI result for Git-only review
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/ifverse-chatgpt-publishing'
        env:
          CI_RESULT: ${{ job.status }}
          PYTHON_RESULT: ${{ steps.python.outcome }}
          MCP_RESULT: ${{ steps.mcp.outcome }}
        run: python scripts/record_publishing_ci.py
# This tests software using short fixtures. It is not a recurring production-video job.

